[package]
name = "google-health-mcp"
version = "0.2.0"
edition = "2021"
description = "MCP server for Google Health API v4 — 35 tools, 39 data types"
repository = "https://github.com/yakushevhk/GoogleHealth"
license = "MIT"

[dependencies]
rust-mcp-sdk = { version = "1.0", default-features = false, features = ["server", "macros", "stdio", "streamable-http", "auth"] }
rust-mcp-axum = "2.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
http = "1"
futures = "0.3"
percent-encoding = "2"
dotenvy = "0.15"
