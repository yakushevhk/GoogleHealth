name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Rust binary
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Upload Rust binary
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/google-health-mcp

      # Go binary
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: cd go && CGO_ENABLED=0 go build -o googlehealth-mcp-go .
      - name: Upload Go binary
        uses: softprops/action-gh-release@v2
        with:
          files: go/googlehealth-mcp-go

      # Python package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd py && pip install build && python3 -m build
      - name: Upload Python package
        uses: softprops/action-gh-release@v2
        with:
          files: py/dist/*
