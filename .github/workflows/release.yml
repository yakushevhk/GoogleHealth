name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write   # GHCR image push

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-binaries:
    name: Rust ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest, asset: linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, asset: linux-arm64 }
          - { target: x86_64-apple-darwin,       os: macos-latest,  asset: macos-x86_64 }
          - { target: aarch64-apple-darwin,      os: macos-latest,  asset: macos-arm64 }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest, asset: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release/google-health-mcp
          EXT=""; [ -f "$BIN.exe" ] && EXT=.exe
          cp "$BIN$EXT" "dist/google-health-mcp-${{ matrix.asset }}$EXT"
      - uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.asset }}
          path: dist/

  go-binaries:
    name: Go binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Build all targets
        run: |
          cd go
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "/tmp/googlehealth-mcp-go-${t%/*}-${t#*/}" .
          done
          mkdir -p ../dist && mv /tmp/googlehealth-mcp-go-* ../dist/
      - uses: actions/upload-artifact@v7
        with:
          name: go-binaries
          path: dist/

  zig-binaries:
    name: Zig binaries (musl, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          curl -sSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ -C /tmp
      - name: Build static musl binaries
        run: |
          mkdir -p dist
          for t in x86_64 aarch64; do
            cd zig && /tmp/zig-x86_64-linux-0.16.0/zig build -Doptimize=ReleaseSmall \
              -Dtarget=$t-linux-musl --prefix /tmp/zig-out-$t && cd ..
            cp "/tmp/zig-out-$t/bin/google-health-mcp" "dist/google-health-mcp-zig-linux-$t"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: zig-binaries
          path: dist/

  php-package:
    name: PHP phar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
      - name: Build executable phar
        run: |
          php -d phar.readonly=0 -r '
            $p = new Phar("google-health-mcp.phar");
            $p->buildFromDirectory("php/", "/\.php$/");
            $p->setStub("#!/usr/bin/env php\n" . $p->createDefaultStub("main.php"));
          '
          chmod +x google-health-mcp.phar
          mkdir -p dist && mv google-health-mcp.phar dist/
      - uses: actions/upload-artifact@v7
        with:
          name: php-dist
          path: dist/

  python-package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: cd py && pip install build && python3 -m build
      - uses: actions/upload-artifact@v7
        with:
          name: py-dist
          path: py/dist/

  docker:
    name: GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name (GHCR requirement)
        run: echo "GHCR_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}

  release:
    name: GitHub Release
    needs: [rust-binaries, go-binaries, python-package, zig-binaries, php-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
