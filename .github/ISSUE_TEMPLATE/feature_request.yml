name: Feature Request
description: Suggest a new tool, data type, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      placeholder: "A new tool for..."
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      placeholder: "I want to..."
  - type: dropdown
    id: language
    attributes:
      label: Which implementation?
      options:
        - All
        - Rust
        - Go
        - TypeScript
        - Python
        - C
        - Zig
        - Astro.js Dashboard
