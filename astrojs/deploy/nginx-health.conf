# nginx: Google Health dashboard
# Dashboard (Astro, :4321) at the domain root under Basic Auth;
# MCP server (Rust, :3000) remains at /mcp and /health.
#
# Setup (see deploy/README.md):
#   1. htpasswd -c /etc/nginx/htpasswd-health <login>
#   2. enable this server block (replace the existing one for your domain)
#   3. nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;
    # If the domain is behind Cloudflare, the https redirect is not needed —
    # Cloudflare terminates TLS itself. Without Cloudflare, uncomment:
    # return 301 https://$host$request_uri;

    # ── MCP server (Rust, protected by its own API key) ──
    location /mcp {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: no buffering and long timeouts
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # ── Dashboard (Astro, :4321) under Basic Auth ──
    location / {
        auth_basic "Google Health";
        auth_basic_user_file /etc/nginx/htpasswd-health;

        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
